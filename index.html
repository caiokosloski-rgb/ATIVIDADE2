<style>
  /* Estilo para deixar as fotos dos alunos redondas e sem borda */
  .estudante-imagem {
    width: 180px;           /* Ajuste o tamanho conforme necessário */
    height: 180px;
    object-fit: cover;      /* Mantém a proporção e preenche bem */
    border-radius: 50%;     /* Deixa a imagem redonda */
    border: none;           /* Remove qualquer borda */
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15); /* Opcional: sombra suave */
    transition: transform 0.3s ease;
  }

  .estudante-imagem:hover {
    transform: scale(1.05); /* Efeito de zoom ao passar o mouse */
  }

  /* Melhorando o layout dos cards */
  .estudante-div {
    text-align: center; c
    margin: 15px;
  }
</style>
