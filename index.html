<style>
    /* === ESTILO DO BANNER MAIS ESTICADO === */
    .banner1 {
        width: 100%;
        height: 500px;           /* Aumente ou diminua conforme quiser */
        overflow: hidden;
        position: relative;
    }

    .escola-imagem {
        width: 100%;
        height: 100%;
        object-fit: cover;       /* Estica a imagem preenchendo todo o espaço */
        object-position: center; /* Centraliza a imagem */
        display: block;
    }

    /* Efeito opcional ao passar o mouse */
    .banner1:hover .escola-imagem {
        transform: scale(1.05);
        transition: transform 0.6s ease;
    }

    /* === Estilo dos alunos (mantido e corrigido) === */
    .estudante-imagem {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: none;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s ease;
    }

    .estudante-imagem:hover {
        transform: scale(1.08);
    }
</style>

  

  
</style>
