<style>
    /* === ESTILO DO BANNER MAIS ESTICADO === */
    .banner1 {
        width: 100%;
        height: 500px;           /* Aumente ou diminua conforme quiser */
        overflow: hidden;
        position: relative;
    }

    .escola-imagem {
        width: 100%;
        height: 100%;
        object-fit: cover;       /* Estica a imagem preenchendo todo o espaço */
        object-position: center; /* Centraliza a imagem */
        display: block;
    }

    /* Efeito opcional ao passar o mouse */
    .banner1:hover .escola-imagem {
        transform: scale(1.05);
        transition: transform 0.6s ease;
    }

    /* === Estilo dos alunos (mantido e corrigido) === */
    .estudante-imagem {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: none;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        transition: transform 0.3s ease;
    }

    .estudante-imagem:hover {
        transform: scale(1.08);
    }
</style>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localização da Arena do Grêmio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #0080ff; /* Azul característico */
        }
        p {
            color: #333;
            font-size: 1.1em;
        }
        .map-container {
            position: relative;
            overflow: hidden;
            padding-top: 56.25%; /* Proporção de tela 16:9 */
            margin-top: 20px;
            border-radius: 4px;
            border: 2px solid #000; /* Linha preta */
        }
        .map-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Arena do Grêmio</h1>
        <p><strong>Endereço:</strong> Av. Padre Leopoldo Brentano, 110 - Humaitá, Porto Alegre - RS, 90250-590</p>
        
        <div class="map-container">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3455.7725917305953!2d-51.19472302353396!3d-29.986616127439054!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95197996aaaaaaab%3A0x6b30f30da4b86cf0!2sArena%20do%20Gr%C3%Aamio!5e0!3m2!1spt-BR!2sbr!4v1710000000000!5m2!1spt-BR!2sbr" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>
    </div>

</body>
</html>
